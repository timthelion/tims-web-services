# DKIM signing configuration for rspamd
# https://rspamd.com/doc/modules/dkim_signing.html

enabled = true;

sign_authenticated = true;
sign_local = true;

use_domain = "header";
use_redis = false;
use_esld = true;
check_pubkey = true;

domain {
    hobbs.cz {
        path = "/tmp/docker-mailserver/rspamd/dkim/hobbs.cz-mail.private";
        selector = "mail";
    }
}
